name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Inno Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y innoextract
      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Build installer
        run: |
          iscc.exe installer\\installer.iss
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          bash gh-build/local-run/build-dist-windows.sh -Mode release
          echo "Release created: see https://github.com/${{ github.repository }}/releases/tag/v1.3.0"
