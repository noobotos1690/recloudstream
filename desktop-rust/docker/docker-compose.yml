# Serves the desktop repository index over a local endpoint so the install path
# can be exercised without publishing anything:  http://127.0.0.1:8080/repo/repo.json
#
# Paths are relative to this file (docker/), hence the ../ prefix. The previous
# revision used ./releases/v1.3.0, which resolves to docker/releases/v1.3.0 and
# never existed, so the container came up with an empty volume.
services:
  repo:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../releases/v1.3.0:/usr/share/nginx/html/repo:ro
      - ../etc/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
