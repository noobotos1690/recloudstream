name: Desktop (Rust)

# Only runs for the Rust tree; the Android build is unaffected.
on:
  push:
    branches: [master, main]
    paths:
      - 'desktop-rust/**'
      - '.github/workflows/desktop-rust.yml'
  pull_request:
    paths:
      - 'desktop-rust/**'
      - '.github/workflows/desktop-rust.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop-rust

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  installer:
    name: Build installer
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rust
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          ./scripts/build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop-rust/installer/Output/*.exe
          if-no-files-found: error
